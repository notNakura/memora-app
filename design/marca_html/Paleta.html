<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memora – colores y tipografía</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=Inter:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2A5A}a:hover{color:#14A38B}
</style>
<div style="width: 880px; height: 560px; box-sizing: border-box; padding: 48px 56px; background: #FFFFFF; display: flex; flex-direction: column; gap: 32px; font-family: 'Inter', system-ui, sans-serif; color: #1E2A5A">
<h1 style="margin: 0; font-family: 'Fredoka', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.5px">Colores y tipografía</h1>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="height: 120px; border-radius: 16px; background: #1E2A5A"></div>
<div style="font-weight: 600; font-size: 16px">Azul índigo</div>
<div style="font-size: 14px; color: #4A5370">#1E2A5A · RGB 30, 42, 90</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="height: 120px; border-radius: 16px; background: #14A38B"></div>
<div style="font-weight: 600; font-size: 16px">Verde azulado</div>
<div style="font-size: 14px; color: #4A5370">#14A38B · RGB 20, 163, 139</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="height: 120px; border-radius: 16px; background: #F2A93B"></div>
<div style="font-weight: 600; font-size: 16px">Ámbar</div>
<div style="font-size: 14px; color: #4A5370">#F2A93B · RGB 242, 169, 59</div>
</div>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; border-top: 1px solid #DDE1EA; padding-top: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Fredoka', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: 0">Aa memora</div>
<div style="font-weight: 600; font-size: 15px">Fredoka Bold — nombre</div>
<div style="font-size: 14px; color: #4A5370">Redondeada, amigable, minúsculas</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 600; font-size: 22px; letter-spacing: 2.5px; line-height: 1.6; padding-top: 14px">REPETICIÓN ESPACIADA</div>
<div style="font-weight: 600; font-size: 15px">Inter SemiBold — eslogan</div>
<div style="font-size: 14px; color: #4A5370">Mayúsculas espaciadas, alta legibilidad</div>
</div>
</div>
</div>
</body>
</html>
