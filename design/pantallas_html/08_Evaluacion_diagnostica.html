<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memora v2 – Diagnóstico</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F2A93B}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0E1430; font-family: 'Inter', sans-serif; color: #FFFFFF; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Volver" style="width: 44px; height: 44px; border-radius: 999px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2E3970">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-weight: 600; font-size: 15px">1 de 10</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.15">Antes de empezar, ¿qué ya sabes?</h1>
<div style="font-size: 16px; line-height: 1.5; color: #B4BBD8">Lo que respondas bien queda como conocido y no lo repasas desde cero.</div>
</div>

<div style="position: relative; margin-top: 64px; background: #FFFFFF; color: #0E1430; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #C9CEDD">
<svg viewBox="0 0 200 200" width="100" height="100" style="position: absolute; top: -86px; right: 12px" aria-hidden="true"><path d="M100 44 C138 44 162 92 166 132 C169 162 142 170 100 170 C58 170 31 162 34 132 C38 92 62 44 100 44 Z" fill="#F2A93B" transform="rotate(0 100 110)"></path><ellipse cx="77" cy="118" rx="4.5" ry="6.5" fill="#0E1430"></ellipse><ellipse cx="123" cy="118" rx="4.5" ry="6.5" fill="#0E1430"></ellipse><g transform="rotate(-8 100 150)"><rect x="70" y="134" width="60" height="38" rx="8" fill="#14A38B"></rect><path d="M82 148 H118 M82 158 H106" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"></path></g><circle cx="72" cy="152" r="8" fill="#F2A93B"></circle><circle cx="128" cy="146" r="8" fill="#F2A93B"></circle></svg>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 23px; line-height: 1.25">¿Qué técnica programa repasos en intervalos cada vez más largos?</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid #0E1430; background: #EEF9F6; font-size: 16px; font-weight: 600; box-sizing: border-box; box-shadow: 0 4px 0 #0E1430"><input type="radio" name="diag" checked style="width: 20px; height: 20px; margin: 0; accent-color: #0E1430">Repetición espaciada</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid #E3E6EF; background: #FFFFFF; font-size: 16px; box-sizing: border-box; box-shadow: 0 4px 0 #E3E6EF"><input type="radio" name="diag" style="width: 20px; height: 20px; margin: 0; accent-color: #0E1430">Estudio intensivo</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid #E3E6EF; background: #FFFFFF; font-size: 16px; box-sizing: border-box; box-shadow: 0 4px 0 #E3E6EF"><input type="radio" name="diag" style="width: 20px; height: 20px; margin: 0; accent-color: #0E1430">Relectura de apuntes</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid #E3E6EF; background: #FFFFFF; font-size: 16px; box-sizing: border-box; box-shadow: 0 4px 0 #E3E6EF"><input type="radio" name="diag" style="width: 20px; height: 20px; margin: 0; accent-color: #0E1430">No lo sé todavía</label>
</fieldset>
</div>

<button style="margin-top: auto; height: 56px; border: none; border-radius: 999px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; box-shadow: 0 4px 0 #C9CEDD; text-transform: uppercase; letter-spacing: 0.8px">Siguiente</button>
</div>
</body>
</html>
