<button role="radio" aria-checked="true" style="height: 48px; border: none; border-radius: 999px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; box-shadow: 0 4px 0 #C9CEDD">90 %</button>
<button role="radio" aria-checked="false" style="height: 48px; border-radius: 999px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; box-shadow: 0 4px 0 #2E3970">95 %</button>
