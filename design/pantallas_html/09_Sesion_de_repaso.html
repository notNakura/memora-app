<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memora v2 – Repaso</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F2A93B}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0E1430; font-family: 'Inter', sans-serif; color: #FFFFFF; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Cerrar repaso" style="width: 44px; height: 44px; border-radius: 999px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2E3970">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="flex: 1; height: 8px; border-radius: 999px; background: #1B2347"><div style="width: 32%; height: 8px; border-radius: 999px; background: #FFFFFF"></div></div>
<div style="font-weight: 600; font-size: 15px">8 / 25</div>
</div>

<div style="flex: 1; background: #FFFFFF; color: #0E1430; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #C9CEDD">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 13px; font-weight: 600; letter-spacing: 1.2px; color: #4A5370">PREGUNTA</div><span style="height: 28px; padding: 0 12px; border-radius: 999px; background: #EEF0F6; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #0E1430">SI3 · Unidad 2</span></div>
<div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.2">¿Qué es la repetición espaciada?</div>
<div style="height: 1px; background: #E3E6EF"></div>
<div style="font-size: 13px; font-weight: 600; letter-spacing: 1.2px; color: #0E7C6A">RESPUESTA</div>
<div style="font-size: 17px; line-height: 1.55">Técnica que programa los repasos en intervalos cada vez más largos, justo antes de que el contenido se olvide.</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #4A5370">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>
Respondiste en 9 s · tu promedio con esta tarjeta es 6 s</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="text-align: center; font-size: 15px; color: #B4BBD8">¿Qué tan bien la recordaste?</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<button style="height: 64px; border-radius: 999px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 #2E3970"><span style="font-weight: 600; font-size: 16px">Otra vez</span><span style="font-size: 13px; color: #B4BBD8">hoy</span></button>
<button style="height: 64px; border: 2px solid #FFFFFF; border-radius: 999px; background: #0E1430; color: #FFFFFF; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 #B4BBD8"><span style="font-weight: 600; font-size: 16px">Difícil</span><span style="font-size: 13px; color: #B4BBD8">en 2 días</span></button>
<button style="height: 64px; border: none; border-radius: 999px; background: #14A38B; color: #0E1430; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 #0B7563"><span style="font-weight: 600; font-size: 16px">Bien</span><span style="font-size: 13px">en 4 días</span></button>
<button style="height: 64px; border: none; border-radius: 999px; background: #F2A93B; color: #0E1430; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 #C17A14"><span style="font-weight: 600; font-size: 16px">Fácil</span><span style="font-size: 13px">en 9 días</span></button>
</div>
</div>
</div>
</body>
</html>
