<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memora – Verifica tu correo</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F2A93B}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0E1430; font-family: 'Inter', sans-serif; color: #FFFFFF; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Volver al paso 1" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2E3970">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px">Verifica tu correo</h1><span style="font-size: 13px; color: #B4BBD8">Crear cuenta · paso 2 de 3</span></div>
</div>

<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #B4BBD8">Enviamos un código de 6 dígitos a <b style="color: #FFFFFF">luis.perez@gmail.com</b>. Vence en 15 minutos.</p>

<div style="display: flex; flex-direction: column; gap: 10px">
<label style="font-size: 14px; font-weight: 600; color: #B4BBD8">Código de verificación</label>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<input aria-label="Dígito 1" inputmode="numeric" value="4" style="height: 60px; min-width: 0; border-radius: 16px; border: 2px solid #F2A93B; background: #1B2347; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #FFFFFF"><input aria-label="Dígito 2" inputmode="numeric" value="8" style="height: 60px; min-width: 0; border-radius: 16px; border: 2px solid #F2A93B; background: #1B2347; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #FFFFFF"><input aria-label="Dígito 3" inputmode="numeric" value="2" style="height: 60px; min-width: 0; border-radius: 16px; border: 2px solid #F2A93B; background: #1B2347; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #FFFFFF"><input aria-label="Dígito 4" inputmode="numeric" value="0" style="height: 60px; min-width: 0; border-radius: 16px; border: 2px solid #F2A93B; background: #1B2347; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #FFFFFF"><input aria-label="Dígito 5" inputmode="numeric" value="1" style="height: 60px; min-width: 0; border-radius: 16px; border: 2px solid #F2A93B; background: #1B2347; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #FFFFFF"><input aria-label="Dígito 6" inputmode="numeric" value="" style="height: 60px; min-width: 0; border-radius: 16px; border: 2px solid #F2A93B; background: #1B2347; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #FFFFFF">
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; color: #B4BBD8">Reenviar código en 0:42</span>
<a href="#" style="font-size: 14px; font-weight: 600; color: #FFFFFF">Cambiar correo</a>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #CFF1E7; color: #0E1430">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span style="font-size: 13px; line-height: 1.4">Lo pedimos para que nadie más pueda usar tu correo, tus datos ni tu lugar en una sección.</span>
</div>

<div style="margin-top: auto; display: flex; justify-content: center"><svg width="120" height="104" viewBox="0 0 120 104" aria-hidden="true"><rect x="10" y="22" width="100" height="70" rx="14" fill="#1B2347" stroke="#6873B0" stroke-width="3"></rect><path d="M14 30l46 32 46-32" fill="none" stroke="#F2A93B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="98" cy="22" r="16" fill="#F2A93B"></circle><path d="M91 22l5 5 9-10" fill="none" stroke="#0E1430" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>

<button style="height: 56px; border: none; border-radius: 999px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; box-shadow: 0 4px 0 #C9CEDD; text-transform: uppercase; letter-spacing: 0.8px">Verificar</button>
</div>
</body>
</html>
