<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memora v2 – Subir mazo</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F2A93B}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0E1430; font-family: 'Inter', sans-serif; color: #FFFFFF; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Volver" style="width: 44px; height: 44px; border-radius: 999px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2E3970">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px">Nuevo mazo</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="v2-nombre" style="font-size: 14px; font-weight: 600; color: #B4BBD8">Nombre del mazo</label>
<input id="v2-nombre" value="Resumen Pere Marquès" style="height: 52px; border-radius: 16px; border: 2px solid #6873B0; background: #1B2347; padding: 0 16px; font-family: 'Inter', sans-serif; font-size: 16px; color: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="v2-materia" style="font-size: 14px; font-weight: 600; color: #B4BBD8">Materia</label>
<select id="v2-materia" style="height: 52px; border-radius: 16px; border: 2px solid #6873B0; background: #1B2347; padding: 0 14px; font-family: 'Inter', sans-serif; font-size: 16px; color: #FFFFFF"><option>Sistemas de Información III</option></select>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<button style="height: 92px; border: none; border-radius: 28px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 #C9CEDD">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Escribir tarjetas</button>
<button style="height: 92px; border-radius: 28px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 #2E3970">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Importar archivo</button>
</div>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px">¿Quién puede verlo?</legend>
<label style="display: flex; gap: 14px; align-items: center; min-height: 60px; padding: 0 16px; border-radius: 16px; background: #1B2347; border: 2px solid #2E3970; box-sizing: border-box; box-shadow: 0 4px 0 #2E3970"><input type="radio" name="v2vis" style="width: 20px; height: 20px; margin: 0; accent-color: #F2A93B"><span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px">Solo yo</span><span style="font-size: 13px; color: #B4BBD8">Privado</span></span></label>
<label style="display: flex; gap: 14px; align-items: center; min-height: 60px; padding: 0 16px; border-radius: 16px; background: #F2A93B; color: #0E1430; box-sizing: border-box; box-shadow: 0 4px 0 #C17A14"><input type="radio" name="v2vis" checked style="width: 20px; height: 20px; margin: 0; accent-color: #0E1430"><span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px">Mi sección</span><span style="font-size: 13px">Sección 1 · el profesor puede avalarlo</span></span></label>
<label style="display: flex; gap: 14px; align-items: center; min-height: 60px; padding: 0 16px; border-radius: 16px; background: #1B2347; border: 2px solid #2E3970; box-sizing: border-box; box-shadow: 0 4px 0 #2E3970"><input type="radio" name="v2vis" style="width: 20px; height: 20px; margin: 0; accent-color: #F2A93B"><span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px">Toda la institución</span><span style="font-size: 13px; color: #B4BBD8">Aparece en Mazos</span></span></label>
</fieldset>

<button style="margin-top: auto; height: 56px; border: none; border-radius: 999px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; box-shadow: 0 4px 0 #C9CEDD; text-transform: uppercase; letter-spacing: 0.8px">Publicar mazo</button>
</div>
</body>
</html>
