<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memora v2 – Reto de dominio</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0E1430}a:hover{color:#1B2347}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F2A93B; font-family: 'Inter', sans-serif; color: #0E1430; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Salir del reto" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: #0E1430; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #03050F">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Reto de dominio</div>
<div style="font-weight: 600; font-size: 15px">7 / 18</div>
</div>

<div style="display: flex; justify-content: center; padding-top: 4px">
<div style="position: relative; width: 200px; height: 200px">
<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Quedan 4 de 6 segundos">
<circle cx="100" cy="100" r="84" fill="none" stroke="#D99428" stroke-width="14"></circle>
<circle cx="100" cy="100" r="84" fill="none" stroke="#0E1430" stroke-width="14" stroke-linecap="round" stroke-dasharray="352 528" transform="rotate(-90 100 100)"></circle>
</svg>
<svg viewBox="0 0 200 200" width="96" height="96" style="position: absolute; right: -86px; bottom: -6px" aria-hidden="true"><path d="M100 44 C138 44 162 92 166 132 C169 162 142 170 100 170 C58 170 31 162 34 132 C38 92 62 44 100 44 Z" fill="#FFFFFF" transform="rotate(0 100 110)"></path><ellipse cx="77" cy="118" rx="4.5" ry="6.5" fill="#0E1430"></ellipse><ellipse cx="123" cy="118" rx="4.5" ry="6.5" fill="#0E1430"></ellipse><path d="M70 106 L84 110 M130 106 L116 110" stroke="#0E1430" stroke-width="4" stroke-linecap="round"></path><circle cx="100" cy="154" r="21" fill="#0E1430"></circle><path d="M100 154 V142 M100 154 L108 159" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"></path><rect x="94" y="128" width="12" height="6" rx="2" fill="#0E1430"></rect><circle cx="82" cy="160" r="8" fill="#FFFFFF"></circle><circle cx="118" cy="160" r="8" fill="#FFFFFF"></circle></svg><div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 76px; line-height: 1">4</div>
<div style="font-size: 14px; font-weight: 600">segundos</div>
</div>
</div>
</div>

<div style="position: relative; margin-top: 8px"><div style="position: absolute; inset: 0; border-radius: 28px; background: #0E1430; transform: translate(10px, -10px) rotate(3deg)"></div><div style="position: relative; background: #FFFFFF; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 6px 0 #C9CEDD"><div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.25">¿En qué fase de Pere Marquès se define el problema?</div><div style="display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px"><button style="min-height: 56px; padding: 10px 12px; border: none; border-radius: 16px; background: #0E1430; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: left; box-shadow: 0 4px 0 #03050F">Análisis instructivo</button><button style="min-height: 56px; padding: 10px 12px; border: 2px solid #E3E6EF; border-radius: 16px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: left; box-shadow: 0 4px 0 #C9CEDD">Diseño computacional</button><button style="min-height: 56px; padding: 10px 12px; border: 2px solid #E3E6EF; border-radius: 16px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: left; box-shadow: 0 4px 0 #C9CEDD">Producción del prototipo</button><button style="min-height: 56px; padding: 10px 12px; border: 2px solid #E3E6EF; border-radius: 16px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: left; box-shadow: 0 4px 0 #C9CEDD">Evaluación externa</button></div></div></div>

<div style="display: flex; gap: 12px">
<div style="flex: 1; background: #0E1430; color: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">5</div>
<div style="font-size: 13px; color: #D6DAEA">confirmadas</div>
</div>
<div style="flex: 1; background: #FFF4E2; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">1</div>
<div style="font-size: 13px; color: #5A3A00">vuelve a repaso</div>
</div>
</div>

<button style="margin-top: auto; align-self: center; height: 44px; padding: 0 20px; border: 2px solid #0E1430; border-radius: 999px; background: transparent; color: #0E1430; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px">Pausar o pedir más tiempo</button>
</div>
</body>
</html>
