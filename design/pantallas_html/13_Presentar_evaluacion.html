<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memora – Presentar evaluación</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F2A93B}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0E1430; font-family: 'Inter', sans-serif; color: #FFFFFF; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Salir de la evaluación" style="width: 44px; height: 44px; border-radius: 999px; background: #1B2347; border: 2px solid #2E3970; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2E3970">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<span style="font-size: 14px; font-weight: 600; color: #B4BBD8">Pregunta 3 de 10</span>
<span style="height: 40px; padding: 0 14px; border-radius: 999px; background: #14A38B; color: #0E1430; display: flex; align-items: center; gap: 6px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>14:32</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<span style="height: 6px; border-radius: 999px; background: #14A38B"></span><span style="height: 6px; border-radius: 999px; background: #14A38B"></span><span style="height: 6px; border-radius: 999px; background: #FFFFFF"></span><span style="height: 6px; border-radius: 999px; background: #2E3970"></span><span style="height: 6px; border-radius: 999px; background: #2E3970"></span><span style="height: 6px; border-radius: 999px; background: #2E3970"></span><span style="height: 6px; border-radius: 999px; background: #2E3970"></span><span style="height: 6px; border-radius: 999px; background: #2E3970"></span><span style="height: 6px; border-radius: 999px; background: #2E3970"></span><span style="height: 6px; border-radius: 999px; background: #2E3970"></span>
</div>

<div style="background: #FFFFFF; color: #0E1430; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 0 #C9CEDD">
<span style="font-size: 13px; font-weight: 600; color: #0E7C6A">Evaluación Unidad 2 · Modelo ER</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 21px; line-height: 1.3">En el modelo ER, ¿qué significa una cardinalidad 1:N?</span>
</div>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">Opciones</legend>
<label style="display: flex; gap: 14px; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 16px; background: #1B2347; border: 2px solid #2E3970; box-sizing: border-box; box-shadow: 0 4px 0 #2E3970"><span style="flex: 1; font-size: 15px">Ambas entidades son opcionales</span><input type="radio" name="op" style="width: 22px; height: 22px; margin: 0; accent-color: #F2A93B"></label>
<label style="display: flex; gap: 14px; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 16px; background: #F2A93B; color: #0E1430; box-sizing: border-box; box-shadow: 0 4px 0 #C17A14"><span style="flex: 1; font-size: 15px; font-weight: 600">Una ocurrencia se relaciona con muchas de la otra entidad</span><input type="radio" name="op" checked style="width: 22px; height: 22px; margin: 0; accent-color: #0E1430"></label>
<label style="display: flex; gap: 14px; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 16px; background: #1B2347; border: 2px solid #2E3970; box-sizing: border-box; box-shadow: 0 4px 0 #2E3970"><span style="flex: 1; font-size: 15px">La relación es recursiva</span><input type="radio" name="op" style="width: 22px; height: 22px; margin: 0; accent-color: #F2A93B"></label>
<label style="display: flex; gap: 14px; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 16px; background: #1B2347; border: 2px solid #2E3970; box-sizing: border-box; box-shadow: 0 4px 0 #2E3970"><span style="flex: 1; font-size: 15px">Hay una sola tabla</span><input type="radio" name="op" style="width: 22px; height: 22px; margin: 0; accent-color: #F2A93B"></label>
</fieldset>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<button style="height: 44px; border-radius: 999px; background: transparent; border: 2px solid #2E3970; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px">Pausar o pedir más tiempo</button>
<button style="height: 56px; border: none; border-radius: 999px; background: #FFFFFF; color: #0E1430; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; box-shadow: 0 4px 0 #C9CEDD; text-transform: uppercase; letter-spacing: 0.8px">Siguiente</button>
</div>
</div>
</body>
</html>
